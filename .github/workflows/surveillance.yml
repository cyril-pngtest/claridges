name: Surveillance Claridge's

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Verifier les disponibilites
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python claridges_tea.py --une-fois

      - name: Enregistrer le journal
        run: |
          git config user.name "surveillance"
          git config user.email "actions@github.com"
          git add claridges_data
          git commit -m "Verification $(date -u +%d/%m-%H:%M)" || exit 0
          git pull --rebase
          git push
